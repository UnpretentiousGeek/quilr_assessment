[project]
name = "assessment-task1-mcp"
version = "0.1.0"
description = "Strict MCP customer lookup and mock refund tools"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.2",
    "httpx2==2.16.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "anyio==4.15.1",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
